<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Script Editor</title>
<style>
  :root { --bg:#141213; --panel:#1E1B1C; --line:#2E2A2B; --ink:#F4EFEA; --dim:#8A817C; --acc:#EF5A35; --ok:#53B754; --warn:#E8B04B; --mono: ui-monospace, Menlo, monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.4 -apple-system, system-ui, sans-serif; }
  .app { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(380px, 1fr); grid-template-rows: auto minmax(0,1fr); height: 100vh; gap: 12px; padding: 12px; }
  .bar { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .bar h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; }
  .btn { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer; }
  .btn:hover { border-color: var(--dim); }
  .btn.primary { background: var(--acc); border-color: var(--acc); color: #1E1B1C; font-weight: 600; }
  select { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: inherit; max-width: 340px; }
  .pill { font: 12px var(--mono); color: var(--dim); }
  .left { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .frame { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
  .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .nav { display: flex; gap: 8px; align-items: center; }
  .nav .steps { margin-left: auto; font: 13px var(--mono); color: var(--dim); }
  .help { color: var(--dim); font-size: 13px; line-height: 1.6; }
  .help kbd { font: 12px var(--mono); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
  .right { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .meta { display: flex; gap: 14px; flex-wrap: wrap; font: 13px var(--mono); color: var(--dim); }
  .meta .ok { color: var(--ok); } .meta .warn { color: var(--warn); } .meta .bad { color: var(--acc); }
  .title { font-size: 18px; font-weight: 600; }
  .file { font: 12px var(--mono); color: var(--dim); }
  textarea { flex: 1; min-height: 0; width: 100%; resize: none; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px 20px; font: 19px/1.6 -apple-system, system-ui, sans-serif; outline: none; }
  textarea:focus { border-color: #4A4446; }
  .status { font: 12px var(--mono); color: var(--dim); min-height: 1.2em; }
  .status.err { color: var(--acc); }
  @media (max-width: 900px) { .app { grid-template-columns: 1fr; grid-template-rows: auto auto minmax(300px,1fr); height: auto; } }
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <h1>Script editor</h1>
    <select id="jump"></select>
    <span class="pill" id="total"></span>
    <span style="flex:1"></span>
    <button class="btn" id="revert" title="Reload this slide's notes from disk">Revert slide</button>
    <button class="btn primary" id="save">Save (⌘S)</button>
  </div>

  <div class="left">
    <div class="frame"><iframe id="deck"></iframe></div>
    <div class="nav">
      <button class="btn" id="prevSlide">⏮ Slide</button>
      <button class="btn" id="prev">◀ Build</button>
      <button class="btn" id="next">Build ▶</button>
      <button class="btn" id="nextSlide">Slide ⏭</button>
      <span class="steps" id="steps"></span>
    </div>
    <div class="help">
      Each <kbd>[click]</kbd> in the script lines up with one build on the slide. Stepping the slide moves your cursor to the matching part of the script.<br>
      <kbd>Esc</kbd> leaves the text box, then <kbd>←</kbd> <kbd>→</kbd> step the slide. <kbd>⌘S</kbd> saves. The script also autosaves 1.5 s after you stop typing.
    </div>
  </div>

  <div class="right">
    <div>
      <div class="title" id="title">Loading…</div>
      <div class="file" id="file"></div>
    </div>
    <div class="meta"><span id="words"></span><span id="clicks"></span></div>
    <textarea id="text" spellcheck="true" placeholder="(no notes)"></textarea>
    <div class="status" id="status"></div>
  </div>
</div>
<script>
(function () {
  var frame = document.getElementById('deck'), ta = document.getElementById('text');
  var S = null, notes = {}, files = {}, cur = null, dirty = false, timer = null, lastStep = -1, lastKey = null;
  var WPM = 135;

  function $(id) { return document.getElementById(id); }
  function send(type, extra) { frame.contentWindow.postMessage(Object.assign({ ns: 'bts', type: type }, extra || {}), '*'); }
  // show each [click] as its own paragraph; strip those breaks back out on save
  function toView(t) { return t.replace(/\n*\[click\]/gi, '\n\n[click]').replace(/^\n+/, ''); }
  function fromView(t) { return t.replace(/\n+\[click\]/gi, '[click]'); }
  function words(t) { return (t.replace(/\[click\]/gi, ' ').match(/\S+/g) || []).length; }
  function fmt(s) { s = Math.round(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  function status(msg, err) { var el = $('status'); el.textContent = msg; el.className = 'status' + (err ? ' err' : ''); }

  function load() {
    return fetch('/api/notes').then(function (r) { return r.json(); }).then(function (d) {
      if (d.error) throw new Error(d.error);
      notes = {}; files = {};
      Object.keys(d).forEach(function (sec) { files[sec] = d[sec].file; Object.keys(d[sec].slides).forEach(function (id) { notes[sec + '/' + id] = d[sec].slides[id]; }); });
    });
  }

  function save() {
    if (!cur || !dirty) return Promise.resolve();
    clearTimeout(timer);
    var key = cur.sec + '/' + cur.id, view = ta.value, text = fromView(view);
    if (text === notes[key]) { dirty = false; status('No changes'); return Promise.resolve(); }
    status('Saving…');
    return fetch('/api/notes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sec: cur.sec, id: cur.id, notes: text, base: notes[key] }) })
      .then(function (r) { return r.json(); }).then(function (d) {
        if (d.conflict) { status('Not saved: ' + d.error + '. Copy your text, then press Revert slide to load the new version.', true); return; }
        if (d.error) throw new Error(d.error);
        notes[key] = text; if (cur && cur.sec + '/' + cur.id === key && ta.value === view) dirty = false;
        status('Saved to ' + d.file + ' · ' + new Date().toLocaleTimeString());
        renderTotal();
      }).catch(function (e) { status('Save failed: ' + e.message, true); });
  }

  function renderMeta() {
    if (!cur || !S) return;
    var t = ta.value, w = words(t), target = Math.round(cur.budgetSec * WPM / 60);
    var ratio = target ? w / target : 1;
    $('words').innerHTML = '<span class="' + (ratio > 1.15 ? 'bad' : ratio < 0.8 ? 'warn' : 'ok') + '">' + w + ' words</span> / target ' + target +
      ' (' + fmt(cur.budgetSec) + ' at ' + WPM + ' wpm) · reads in ~' + fmt(w / WPM * 60);
    var c = (t.match(/\[click\]/gi) || []).length, need = S.steps - 1;
    $('clicks').innerHTML = '<span class="' + (c === need ? 'ok' : 'bad') + '">' + c + ' [click] markers</span> / slide has ' + need + ' click' + (need === 1 ? '' : 's');
  }

  function renderTotal() {
    if (!S) return;
    var tw = 0, tb = 0;
    S.slides.forEach(function (x) { var k = x.sec + '/' + x.id; tw += words(cur && k === cur.sec + '/' + cur.id ? fromView(ta.value) : (notes[k] || '')); tb += x.budgetSec; });
    $('total').textContent = 'talk: ' + tw + ' words ≈ ' + fmt(tw / WPM * 60) + ' of ' + fmt(tb) + ' budget';
  }

  // put the caret at the start of the segment for build `step`
  function caretToStep(step) {
    var t = ta.value, re = /\[click\]/gi, pos = 0, k = 0, m;
    while (k < step && (m = re.exec(t))) { pos = m.index; k++; }
    if (step === 0) pos = 0;
    ta.setSelectionRange(pos, pos);
    // scroll so the caret line is near the top third
    ta.scrollTop = Math.max(0, (t.length ? pos / t.length : 0) * ta.scrollHeight - ta.clientHeight / 3);
  }

  // show the slide S currently points at, with notes freshly read from disk
  function showSlide() {
    var d = S, s = d.slides[d.index], key = s.sec + '/' + s.id;
    cur = s; lastKey = key; lastStep = -1; dirty = false;
    ta.value = notes[key] != null ? toView(notes[key]) : '';
    ta.disabled = notes[key] == null;
    ta.placeholder = notes[key] == null ? '(this slide has no notes field to edit)' : '(no notes)';
    $('title').textContent = (d.index + 1) + ' / ' + d.slides.length + ' · ' + s.secTitle + ' · ' + s.title;
    $('file').textContent = (files[s.sec] || '') + '  →  id: \'' + s.id + '\'';
    $('jump').value = d.index;
    history.replaceState(null, '', '#/' + key);
    renderStep();
  }
  function renderStep() {
    $('steps').textContent = 'build ' + (S.step + 1) + ' / ' + S.steps;
    if (S.step !== lastStep) { lastStep = S.step; caretToStep(S.step); }
    renderMeta(); renderTotal();
  }

  var switching = false;
  function onState(d) {
    S = d;
    if (switching) return;                       // showSlide() will pick up the latest S
    var s = d.slides[d.index], key = s.sec + '/' + s.id;
    if (key === lastKey) return renderStep();
    switching = true;
    (dirty ? save() : Promise.resolve()).then(load).catch(function (e) { status('Could not reload notes: ' + e.message, true); })
      .then(function () { switching = false; showSlide(); });
  }

  window.addEventListener('message', function (e) {
    var m = e.data; if (!m || m.ns !== 'bts' || m.type !== 'state') return;
    if (!$('jump').options.length) {
      $('jump').innerHTML = m.slides.map(function (x) { return '<option value="' + x.i + '">' + (x.i + 1) + '. ' + x.secTitle.split(' — ')[0] + ' · ' + x.title + '</option>'; }).join('');
    }
    onState(m);
  });

  frame.addEventListener('load', function () {
    var tries = 0, iv = setInterval(function () { if (S || tries++ > 40) return clearInterval(iv); send('hello'); }, 150);
  });

  ta.addEventListener('input', function () { dirty = true; status('Unsaved changes'); renderMeta(); renderTotal(); clearTimeout(timer); timer = setTimeout(save, 1500); });
  $('save').onclick = save;
  $('revert').onclick = function () { if (!cur) return; load().then(function () { showSlide(); status('Reloaded from disk'); }); };
  $('next').onclick = function () { send('next'); };
  $('prev').onclick = function () { send('prev'); };
  $('nextSlide').onclick = function () { if (S) send('goto', { index: Math.min(S.slides.length - 1, S.index + 1) }); };
  $('prevSlide').onclick = function () { if (S) send('goto', { index: Math.max(0, S.index - 1) }); };
  $('jump').onchange = function () { send('goto', { index: +this.value }); };

  document.addEventListener('keydown', function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); if (dirty) save(); else status('No changes to save'); return; }
    if (e.key === 'Escape') { ta.blur(); return; }
    var t = e.target; if (t === ta || t.tagName === 'SELECT') return;
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); send('next'); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); send('prev'); }
  });
  window.addEventListener('beforeunload', function (e) { if (dirty) { save(); e.preventDefault(); e.returnValue = ''; } });

  // open at the slide in our own hash, if any
  load().then(function () {
    frame.src = '../index.html' + (location.hash || '');
  }).catch(function (e) { status('Could not load notes: ' + e.message + ' — is script-editor.py running?', true); });
})();
</script>
</body>
</html>
